  takeaways:
    - "A live product is a history of versions and operating conditions, not one model score."
    - "Recognition quality, transport availability, state stability, latency, and publication behavior are different parts of the viewer experience and must remain visible."
    - "A song guesser does not become a scientific instrument; telemetry can establish how it operated, while claims about helping viewers require direct or explicitly first-person evidence."
    - "The retrospective earns its conclusion from the complete eleven-show August-run record, including failed runs and changes made along the way."
