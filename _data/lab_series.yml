# Canonical editorial plan for "The Machine in the Lab." The landing page uses
# the reader-facing fields; the draft editorial-plan page also renders the
# internal purpose, outline, evidence, takeaways, and scope boundaries.

- slug: science-at-llm-speed
  title: "Part 1. Science at LLM Speed"
  subtitle: "Research-like output is cheap. A valid claim still needs evidence that can show it is wrong."
  url: /series/the-machine-in-the-lab/science-at-llm-speed/
  status: published
  date: 2026-08-15
  estimated_words: "3,800-4,500 words"
  purpose: "Establish the state of LLM-mediated research before turning to the author's project: the same systems now help write, search, review, and execute science, with evidence ranging from fabricated citations and covert reviews to useful feedback and externally verified discoveries."
  discovery_loop_role: "Introduce the emerging goal of automating the experimental loop itself, including Discovery Loop as a contemporary example, then define the series' central question: what independently evaluates each trip around that loop?"
  outline:
    - title: "The literature is no longer entirely about things that happened"
      detail: "Open with confirmed nonexistent references in real conference submissions, then distinguish an invented citation from an ordinary bibliographic error and from a citation that exists but does not support the claim."
    - title: "Background work without background work"
      detail: "Move from controlled citation-fabrication studies to 2026 large-scale audits of papers and preprints, explaining what those audits establish and why they cannot prove that every invalid reference was generated by an LLM."
    - title: "The publication accelerator"
      detail: "Describe evidence that LLM-assisted manuscript production is increasing output, while treating causal productivity estimates cautiously because adoption is inferred and high-output authors are easier to classify as adopters."
    - title: "From assistant to discovery loop"
      detail: "Introduce Discovery Loop as a contemporary signal that the unit of automation is expanding from one research task to the propose-run-evaluate-revise cycle. Use the audio project as a small, independent case that exposes what such a loop must preserve and validate; do not speculate about the company's unpublished architecture."
    - title: "A science-shaped artifact outside academic publication"
      detail: "Use end-user data-analysis research to show that generative systems can make sophisticated analysis activities available without supplying the expertise needed to verify methods and interpretations. Then use an unnamed fan-published analytics project only to illustrate a preexisting extra-academic publication category: a serious, transparent data product with a large corpus, methodology pages, equations, polished visualizations, and named findings. Do not present the category as an LLM invention or infer the creator's affiliation, training, or use of an LLM. Raise the category problem without litigating its labels or specific musical claims; the author's own case earns the construct-validity lesson in Part 4."
    - title: "The reviewer might be a model"
      detail: "Contrast estimated covert LLM modification of conference reviews with explicit systems: author-side paper feedback, ICLR's randomized review-feedback intervention, and AAAI's labeled supplementary AI reviews."
    - title: "The machine can also find something real"
      detail: "Present FunSearch, OpenScholar, AI Scientist v2, and Co-Scientist as different claims about acceleration, carefully separating verifiable discoveries, literature synthesis, workshop acceptance, and experimentally tested biomedical hypotheses."
    - title: "What separates acceleration from theater"
      detail: "Identify the common pattern in the strongest cases: outputs are checked against something outside the model's prose, such as executable evaluators, retrieved source passages, blinded humans, or wet-lab experiments."
    - title: "A small audio lab enters this moment"
      detail: "Close by introducing the author's project as a concrete attempt to use an LLM agent across the same research lifecycle, and tee up the two notebooks that looked complete before their experimental foundations collapsed."
  evidence:
    - "Controlled 2023 Scientific Reports study: 55% of GPT-3.5 and 18% of GPT-4 citations were fabricated in the tested literature-review prompts."
    - "2026 cross-repository audit of 2.5 million papers and preprints, plus ICLR 2026's human-confirmed desk rejections for nonexistent references."
    - "ICML 2024 corpus estimate that 6.5-16.9% of review text at four AI conferences was substantially LLM-modified."
    - "ICLR 2025 randomized review-feedback intervention over more than 20,000 reviews and AAAI's explicit supplementary AI-review pilots."
    - "National Academies distinction between computational reproducibility and scientific replicability, plus Center for Open Science guidance on exploration versus confirmation. The construct-validity literature remains background for Part 4 rather than a Part 1 conclusion."
    - "Drosos et al.'s CHIWORK participatory study of 15 end users: generative AI supported data-analysis sensemaking while creating query, context, and verification burdens."
    - "Goh, Polster, Wong, Cvijovic, et al.'s 2026 npj Digital Medicine perspective separating access to functional analysis code from the expertise required to judge whether the analysis is scientifically valid."
    - "Private audit of an adjacent fan-analytics project's first methodology and analysis posts. It supports editorial fact-checking, but the public Part 1 example should use only the non-identifying facts needed to show that a science-shaped artifact was published outside a formal academic venue."
    - "OpenScholar, FunSearch, AI Scientist v2, and Co-Scientist primary reports."
    - "Annotated source dossier: /series/the-machine-in-the-lab/science-at-llm-speed-sources/."
  takeaways:
    - "LLMs are entering science as authors' tools, literature interfaces, reviewers, programmers, hypothesis generators, and institutional infrastructure at the same time."
    - "LLMs make fluent scholarly form cheap to produce; that form is not verified scholarly substance."
    - "Data science can support scientific inquiry, but data, equations, charts, and computational reproducibility do not by themselves make an analysis a scientific result."
    - "Generative systems can widen access to sophisticated data-analysis activity without automatically supplying the expertise required to verify methods or interpretations."
    - "Serious science-shaped analysis also appears outside journals and conferences; its validity depends on the question, evidence, and validation rather than its publication venue or polished form."
    - "Calling that work non-academic does not make it false; it makes the relationship among product judgment, descriptive analysis, and validated empirical inference important to state."
    - "The strongest acceleration results bind generation to retrieval, execution, measurement, or independent experimentation."
    - "The important question is not whether AI can do research in the abstract, but which epistemic decisions it is allowed to make and what independently judges them."
  excludes:
    - "Do not claim every invalid citation detected after 2023 was generated by AI."
    - "Do not equate workshop acceptance with scientific discovery or peer review with truth."
    - "Do not credit LLMs with all AI-for-science advances; distinguish language-agent systems from systems such as AlphaFold."
    - "Do not name or link the adjacent fan project in the public draft by default. Avoid exact identifying numbers unless attribution becomes necessary and the naming decision is reconsidered."
    - "Do not imply that the adjacent project used an LLM, that its creator lacks formal research training, or that its reception was substantial."
    - "Do not imply that science-shaped fan analysis began with LLMs or that this one artifact demonstrates a historical increase."
    - "Do not litigate the adjacent project's label reliability, measurement unit, or named musical result in Part 1. Those details identify the project and prematurely teach Part 4's central lesson."
    - "Do not imply transparency, reproducible formulas, or product scoring are worthless. Their presence is what makes the outside-academia example important rather than dismissible."
    - "Do not direct this criticism only at an adjacent project. The author's own polished metrics, reports, and internal checks are the central example of scientific-looking work outrunning its evidence."
    - "Do not turn the post into an anti-AI catalogue; the positive results are necessary to explain why the risk is worth engaging."

- slug: two-notebooks-lost
  title: "Part 2. Two Notebooks Lost"
  subtitle: "The first collapsed under validation. The second repeated a mistake it had already named."
  url: /series/the-machine-in-the-lab/two-notebooks-lost-series/
  status: scheduled
  date: 2026-08-18
  estimated_words: "3,000-3,500 words"
  purpose: "Show what happened when an experienced, PhD-trained systems researcher used an LLM agent to make an ambitious self-directed audio-research program tractable: two silent setup decisions became foundations for plausible downstream work while creating different information and meaning failures."
  discovery_loop_role: "Show the uncontrolled loop in practice: an agent could propose, implement, run, interpret, and extend experiments while its reports failed to surface or enforce the premises entering the next iteration."
  outline:
    - title: "The deletion evening"
      detail: "Open on deleting two notebooks, taking two blog posts offline after three people had read them, and taking down a listening study after friends had already spent time on it."
    - title: "The audio-research project"
      detail: "Preserve the complete chronology for a standalone reader: automatic set detection was the original goal; the corpus and apparent power of audio features pulled the project into the Type I/Type II improvisation detour where the two notebooks failed; SetScope later returned to the original target. Establish the author's research background, corpus, labels, and why an LLM agent made work at this scale possible. Treat the PhD as evidence that the constraints were understood and explicit, while making clear that expertise cannot reveal a violation the autonomous system neither blocks nor reports."
    - title: "Notebook 1"
      detail: "Reconstruct the performance-level train/test leak, why the resulting numbers looked compelling, and why no downstream result could be repaired after the boundary was crossed."
    - title: "Notebook 2"
      detail: "Trace the inherited 90-second segmentation default through nine scripts, fingerprints, clusters, charts, prose in the blog posts, and the listening study. Name both layers: the immediate defect was implementation fidelity because the default violated the written method; the deferred scientific debt was measurement validity because the convenient segment then defined what phenomenon the analysis could observe."
    - title: "The shared shape"
      detail: "Show that neither failure was bad syntax or an obvious hallucination. Each was a locally plausible decision that remained invisible while the agent accelerated everything built on top of it."
    - title: "Two failures, two debts"
      detail: "Separate the mechanics explicitly. Notebook 1 crossed an information boundary and creates the question answered in Part 3. Notebook 2 let a convenient segmentation procedure define the observable phenomenon and creates the meaning question paid off in Part 4. The shared propagation mechanism should not collapse them into the same error."
    - title: "The question for the series"
      detail: "End by preserving both unresolved questions: how the project protects information independence, answered in Part 3, and how it establishes that a measurement represents the named phenomenon, answered in Part 4."
  evidence:
    - "The existing 5,183-word Two Notebooks Lost source draft."
    - "Notebook 3 repository preamble documenting the N1 leak and N2 segmentation failure."
    - "Research-discipline postmortem and retained Git history."
  takeaways:
    - "In empirical work, setup is not preliminary plumbing; setup is the experiment."
    - "LLM-generated research can be invalid while the code, charts, and prose all look professional."
    - "The cost of a hidden assumption grows with every artifact the agent produces before surfacing it."
    - "An autonomous research system must prevent or report violations of explicit constraints; requiring the operator to reconstruct every run defeats the premise."
    - "Different setup failures require different remedies: protecting independence cannot establish that a measurement corresponds to the phenomenon in the claim."
  excludes:
    - "Do not explain the complete R-1 through R-11 governance system here."
    - "Keep Q01 and Q02 to a compact account of the project's immediate response: the new discipline could retire or narrow questions, but had not yet solved measurement validity. Part 4 owns the later failure of those internal gates; Part 6 owns the mature operating protocol."
    - "Do not present the current SetScope engineering result as the resolution."
    - "Do not make the lesson that the author should personally inspect every split, constant, or generated artifact. Preserve responsibility for putting the work online while locating the system failure in missing enforcement and disclosure."

- slug: the-holdout-is-a-one-way-door
  title: "Part 3. The Holdout Is a One-Way Door"
  subtitle: "Evidence cannot independently confirm the claim it helped shape."
  url: /series/the-machine-in-the-lab/the-holdout-is-a-one-way-door/
  status: scheduled
  date: 2026-08-21
  estimated_words: "2,500-3,000 words"
  purpose: "Explain leakage as an information-flow problem rather than a faulty train_test_split call, using the project history to show how files, performances, caches, labels, derived features, and human adaptation can all cross the boundary."
  discovery_loop_role: "Define the loop's memory problem: results from one iteration change the agent, artifacts, and human operator, so evidence cannot remain independent merely by living in another directory."
  outline:
    - title: "A split is a promise"
      detail: "Define the holdout as a one-way information boundary for the claim, candidate, and adaptive research lineage it evaluates, not merely a directory or dataframe column. Opening data does not make it unusable for unrelated future questions."
    - title: "The obvious leak"
      detail: "Return briefly to N1 and distinguish file-level separation from performance-level and whole-show separation."
    - title: "The leak hiding in the cache"
      detail: "Walk through the later purge of 1,120 artifacts descended from the two invalid notebooks as a mixed set. State that the surviving audit does not allocate every file cleanly by lineage and do not imply lineage-specific counts. Use only documented N1 examples to explain information contamination; documented N2 examples embodied an invalid measurement premise and return in Part 4."
    - title: "Why the smoke test passed"
      detail: "Explain the tautological integrity check: the pinned value and the re-derived value agreed because both were computed from the same contaminated baseline."
    - title: "The human is part of the leak path"
      detail: "Show how feature choices, thresholds, aliases, exclusions, and hypotheses change after outcomes are seen even when no test label appears in training code."
    - title: "The current boundary"
      detail: "Describe performance grouping, duplicate control, point-in-time features, engineering versus sealed populations, opaque labels, frozen hashes, and the rule that an opened holdout cannot become sealed again for the claim, candidate, or adaptive lineage it helped shape."
  evidence:
    - "N1 training/test leakage record."
    - "The May 17 cache-contamination erratum and 1,120-file purge."
    - "Corrected post-cutoff evaluation boundaries and sealed-date audit commits."
    - "The current SetScope experimental-integrity contract."
  takeaways:
    - "Leakage includes information available to the experiment designer, not only rows available to the optimizer."
    - "Derived artifacts inherit the data role and contamination state of their sources."
    - "A self-consistent check is not an independent check."
    - "Once outcomes influence design, the data can remain useful for engineering and unrelated future questions but cannot independently confirm the affected claim or candidate."
  excludes:
    - "Do not turn this into a generic cross-validation tutorial."
    - "Do not cover construct or measurement validity in depth; that is Part 4."
    - "Do not imply that opening data contaminates it for every unrelated future research question."
    - "Do not claim the sealed SetScope evaluation has been completed."

- slug: when-every-check-passes
  title: "Part 4. When Every Check Passes"
  subtitle: "All the artifacts agreed. The interpretation had never been tested."
  url: /series/the-machine-in-the-lab/when-every-check-passes/
  status: scheduled
  date: 2026-08-24
  estimated_words: "2,800-3,400 words"
  purpose: "Pay off the meaning problem first exposed by Notebook 2 and demonstrate the limit of process-heavy agent review: a result can pass every internal-consistency gate and still make the wrong claim about the underlying world."
  discovery_loop_role: "Define the loop's evaluator problem: rapid iteration optimizes whatever signal closes the loop, including a technically consistent proxy that does not measure the claimed phenomenon."
  outline:
    - title: "The debt that cleanup did not pay"
      detail: "Reconnect briefly to Notebook 2: fixing leakage and documenting constants did not answer whether a convenient segmentation or detector corresponded to the musical phenomenon named in the claim."
    - title: "Every recorded check was green"
      detail: "Reconstruct Dispatch 002 from approved plan through code, artifact, figure, prose, advisor, and publication checks."
    - title: "The first actual listen"
      detail: "Describe the user's first spot check and why a detector firing near track end made the published interpretation immediately suspect."
    - title: "The first diagnosis was wrong too"
      detail: "Preserve the uncomfortable middle step: the project initially blamed systematically bad labels before the author reviewed all ten positive Q23 cases. The preserved case table records eight composed-return marks, one track-end mark, and one rejected mark, while its prose summary incorrectly says nine of ten. Name the contradiction and use the case table. State plainly that this was a single-rater, outcome-aware, post-publication check, not blinded annotation or an agreement study."
    - title: "The replacement explanation also outran the evidence"
      detail: "Explain how the detector selected the final large onset-density change and was therefore biased toward late events. The broader table contains seven hits, all composed returns 36-127 seconds before the archive boundary; its valid Sand miss is only four seconds beyond that range, while the Gin miss uses the track-end label and the Reba mark was rejected. The selected review invalidates the strong first diagnosis but does not prove the withdrawal summary's track-end-confound explanation."
    - title: "Internal consistency versus measurement validity"
      detail: "Separate code-matches-plan, numbers-match-artifacts, and prose-matches-numbers from the different question of whether the measurement and interpretation correspond to what is audible."
    - title: "The role and limits of the domain check"
      detail: "Explain that returning to the audio supplied a different evidence modality and corrected both the original interpretation and the first attempted diagnosis. Distinguish the original primed author-listener check from the later R-11 design requiring neutral metadata, randomized presentation, no preloaded notes, and structured submissions for future checks."
  evidence:
    - "Dispatch 002 publication and withdrawal records, including the complete recorded approval chain."
    - "The original labeling instructions and their two jam-end interpretations."
    - "The author's single-rater, outcome-aware ten-case acoustic review and corrected diagnosis."
    - "R-11 and its later neutralized, randomized listening-assignment requirements."
  takeaways:
    - "Multiple agents can share the same blind spot because they are checking the same artifact chain."
    - "Traceability proves where a claim came from; it does not prove the claim corresponds to reality."
    - "Construct and measurement validity require contact with the underlying phenomenon through a different evidence path, with evaluator dependence and information exposure reported."
    - "Reviewing selected positive cases can challenge an interpretation but cannot estimate false negatives, specificity, or detector-wide validity."
    - "Errata need their own evidence because the first explanation of a failure may also be wrong."
  excludes:
    - "Do not portray adding another reviewer agent as the solution."
    - "Do not make the original listening check sound blinded, multi-rater, evaluator-independent, infallible, or free of priming."
    - "Keep the live browser/product story for Part 5."

- slug: the-browser-is-part-of-the-experiment
  title: "Part 5. The Browser Is Part of the Experiment"
  subtitle: "A model score cannot tell you what the live system actually heard."
  url: /series/the-machine-in-the-lab/the-browser-is-part-of-the-experiment/
  status: scheduled
  date: 2026-08-27
  estimated_words: "3,000-3,800 words"
  purpose: "Show why component metrics cannot predict the behavior of an end-to-end product path, and why hands-on browser rehearsals were part of building and evaluating the product rather than a ceremonial demo after the research. SetScope has an ordinary product job: show a viewer the song Goose is probably playing right now. Its guesses are product outputs, not scientific findings."
  discovery_loop_role: "Define the loop's execution problem: an experiment performed against an archive, component, or synthetic input does not evaluate the browser, audio transport, controller, and display path the product actually runs."
  outline:
    - title: "A song guesser, not a scientific instrument"
      detail: "Define SetScope in plain product terms: it listens to the stream and shows viewers its best current-song guess so they do not have to consult an external setlist. Separate the user-visible guess from the product-test record and from any methodological claim the series later draws from how the system was evaluated."
    - title: "The 85 percent that was not live accuracy"
      detail: "Explain the historical 46/54 segmented-track result, the five-show holdout, missing catalog labels, and why the number was described too broadly."
    - title: "The demo that contradicted the report"
      detail: "Recount premusic locks, unstable identities, unanimous votes that took too long, and a six-minute run in which no music was admitted."
    - title: "The model was not hearing the browser"
      detail: "Trace Chrome through macOS routing, BlackHole, FFmpeg AVFoundation, segmentation, resampling, the music gate, and model inference."
    - title: "What the captured audio showed"
      detail: "Document periodic exact-zero gaps, lost samples, the audience-versus-archive gate discrepancy, and why segment timestamps falsely reported health."
    - title: "Repairing observability before ranking"
      detail: "Cover native CoreAudio capture, frame accounting, duration reconciliation, per-segment signal metrics, exact-byte replay, and explicit invalid-run states."
    - title: "Evaluating the complete product"
      detail: "Define the product evaluation surface: premusic behavior, initial lock, hold stability, transitions, unknowns, latency, false switches, capture validity, and publication decisions. These measurements guide engineering and release choices; they do not turn the song guesses into scientific results."
    - title: "The night the narrow question worked"
      detail: "Use the August 13 San Diego live run as a real product field test. The show audio could not have entered training or development, and the runtime emitted correct blind song guesses while the show was happening. Saved product output later showed correct identities emitted at least once for 10/12 song performances, alongside three false switches and two misses. A separate post-show internal acoustic-family diagnosis found 11/12; keep it explicitly diagnostic rather than presenting it as another product-capability count. Report all of these as observations about that version, not as a scientific finding, viewer-benefit claim, or formal whole-show accuracy estimate: Set 1 failed the planned capture check, and the 61.5% Set 2 held-state diagnostic used approximate post-show boundaries rather than a frozen truth timeline. The preserved audit documents shadow traces and does not establish that optional chat publication was armed or delivered."
  evidence:
    - "v0506 browser-capture integrity incident."
    - "Animal exact-byte replay and gate-hysteresis A/B."
    - "Dr. Darkness-to-Drive two-song run and shutdown-drain defect."
    - "August 13 prospective live-canary preregistration and v0521 post-show audit."
    - "The current controlled-browser-rehearsal rules."
  takeaways:
    - "An offline model score says nothing about transport stages it never exercised."
    - "A live product test becomes much more useful for debugging and release decisions when inputs, operator actions, validity, and outcomes are recorded rather than curated."
    - "Observability belongs in the experimental design because missing or corrupt input can masquerade as model behavior."
    - "The behavior viewers experience is a property of the deployed decision pipeline, not its strongest component."
    - "The live show established the practical fact that the tool could make correct blind guesses during a genuinely new show while leaving whole-show accuracy, continuous state reliability, transitions, unknown material, and catalog-wide generalization open."
  excludes:
    - "Do not frame browser testing as anecdotal replacement for corpus evaluation."
    - "Do not imply capture repair solved song recognition by itself."
    - "Do not turn 11/12 acoustic discovery into live product accuracy; the emitted sequence and held-state result were materially worse."
    - "Do not publish current launch-readiness claims here."

- slug: what-we-built-instead
  title: "Part 6. A Discovery Loop That Can Say No"
  subtitle: "A strong result should authorize only the next step its evidence can support."
  url: /series/the-machine-in-the-lab/what-we-built-instead/
  status: scheduled
  date: 2026-08-30
  estimated_words: "3,200-4,000 words"
  purpose: "Synthesize the practical research system that emerged and close the story with the fan-facing product it helped build. SetScope's guesses are not offered as scientific evidence: they are the output of a live song guesser. The methodological claim concerns how the project records failures and limits what may be inferred from engineering tests; broad numerical reliability claims remain reserved for clean evaluations if the author later chooses to make them."
  discovery_loop_role: "Present the systems contribution directly: a loop needs typed state, provenance, claim-scoped permissions, independent checks, invalid outcomes, stop conditions, and a promotion boundary that the generating agent cannot silently cross."
  checkpoint: "Enough exists to draft the post: the August 13 live field test, v0532 opened-engineering result, frozen browser-rehearsal protocol, and the product's deliberately narrow purpose. Still unavailable are a final-candidate sealed result, a metric-eligible whole-show estimate, and an outward-publication receipt; the post must not claim any of those."
  outline:
    - title: "The loop is the system"
      detail: "Return explicitly to the contemporary Discovery Loop ambition without speculating about its implementation. Show why automating propose-run-evaluate-revise makes information lineage, evaluator validity, real-path execution, and promotion authority into systems properties rather than optional research advice."
    - title: "From instructions to state"
      detail: "Explain why methodology had to become durable artifacts and executable permissions rather than a long prompt the agent was expected to remember."
    - title: "The experiment lifecycle"
      detail: "Walk through question, preregistration, frozen inputs and hashes, label-blind execution, immutable output, scoring, result, invalidation, and promotion boundaries."
    - title: "Different evidence for different claims"
      detail: "Classify evidence on separate axes: information access relative to the candidate, temporal relation, system scope, publication-action scope, and metric eligibility. Show why August 13 can be unavailable-at-freeze, prospective, and live-runtime evidence while still lacking a preserved UI-observation receipt and failing the intended whole-show metric, then opened/adaptive for later candidates after review."
    - title: "The live product result already in hand"
      detail: "Start with the August 13 field test: SetScope emitted correct blind guesses during a show that had not existed when it was built. Preserve both what the logs establish and what the capture, display-receipt, and truth-timeline gaps leave unknown. A guess is product output; a persisted, provenance-rich field-test record can support bounded product and methodological claims without turning the guess into a scientific finding."
    - title: "What v0532 later establishes"
      detail: "Report the subsequent 75-show outcome-informed engineering result with raw denominators, selective precision, coverage, transitions, and the explicit limits written into the result artifact. Do not let its larger sample demote or replace the earlier prospective result."
    - title: "A product with open measurements"
      detail: "Separate the existence of a viewer-facing prototype from claims about its usefulness. Catalog-wide reliability, continuous-state accuracy, automatic-publication safety, and viewer benefit remain unmeasured. Include later sealed or prospective results only if they exist before publication; otherwise leave those measurements plainly open without making the methodological story itself feel unfinished."
    - title: "A reusable operating protocol"
      detail: "Close with a concise, case-derived protocol readers can test and adapt: claim-scoped data roles, preregister-run-score separation, differently sourced reality checks, whole-system rehearsal, an experiment ledger, and claim-specific promotion gates. State that it is not an exhaustive validity taxonomy or a proven universal method."
  evidence:
    - "Research-discipline evolution from R-1 through R-11 and its own recorded failures."
    - "Current preregistration/result pairs and deterministic artifact hashes."
    - "August 13 prospective live-canary preregistration and post-show audit."
    - "v0532 label-blind engineering replay over 75 opened shows."
    - "The frozen sealed-execution protocol and current provenance audit artifacts."
  required_evidence:
    - "A one-time frozen sealed result is required only for a broad quantitative reliability or independent-generalization claim, with the population and sampling frame stated."
    - "Additional metric-eligible prospective complete-product evaluation is required only for a quantitative claim about future whole-show operation through the user-visible state."
    - "An outward-publication receipt is required only if Part 6 claims that automatic public setlist publication was exercised successfully."
  takeaways:
    - "The discovery loop, rather than the model or prompt, is the unit that must be designed and evaluated."
    - "The useful unit of autonomy is a bounded experiment with explicit permissions, not an open-ended instruction to keep improving."
    - "An auditable workflow preserves negative results, constrains automatic actions, and makes unsupported promotion visible; it cannot guarantee that people will honor its permissions."
    - "A deployed prototype, a broad reliability estimate, a viewer-benefit claim, and a decision to publish guesses automatically are separate milestones."
    - "The method succeeds as an audit discipline only if later sealed and prospective results remain legible even when they are disappointing; the fan-facing product does not have to masquerade as a scientific result to matter."
  excludes:
    - "Do not let the August 13 live product test stand in for a whole-show metric, the still-unrun sealed evaluation, or final-candidate prospective acceptance."
    - "Do not call v0532 a sealed or product-grade result."
    - "Do not reduce the protocol to an agent-role org chart; the data and artifact boundaries are load-bearing."

- slug: what-happened-on-tour
  title: "Part 7. What Happened on the August Run"
  subtitle: "A live product is a history of versions, misses, and repairs, not one score."
  url: /series/the-machine-in-the-lab/what-happened-on-tour/
  status: collecting-results
  estimated_words: "2,800-3,500 words"
  purpose: "End the series with a product retrospective after Goose's eleven-show August 13-28 western run: what each instrumented version emitted, how quickly it guessed songs, where it held or switched incorrectly, when the audio path failed, and how its timing compared with precisely defined external setlist observations. This is a versioned operational history of a fan tool, not a claim about the complete 24-show summer tour, a scientific study of Goose's music, a viewer-effect study, or a single score pooled across changing software."
  discovery_loop_role: "Evaluate the loop longitudinally: show how versions, failures, interventions, and operating conditions changed what the system could do without rewriting earlier outcomes as if the final version had produced them."
  checkpoint: "The retrospective structure and collection policy are frozen for the August 13-28 western run. Results prose waits for the August 28 cutoff and a reconciled per-show record. August 13 supplies the first field-test case, not the conclusion."
  outline:
    - title: "What the tool promised"
      detail: "Restate the narrow product job for a standalone reader: listen to a Goose stream and show a current-song guess without consulting an external setlist. Define the observable output and intended use separately; the August-run telemetry measures system behavior, not whether viewers benefited."
    - title: "The record we kept"
      detail: "Describe the per-show ledger: application and model versions, run mode, audio-capture health, music admission, emitted guesses, locks, corrections, abstentions, chat or publication actions, post-show truth reconciliation, and external setlist-update times when their timestamp semantics are comparable."
    - title: "The August run is not one frozen model"
      detail: "Show the product as an evolving sequence of versions. Report each stable version separately and identify the shows that motivated changes. Do not pool an improving system into one headline percentage or treat later fixes as if they had existed during earlier failures."
    - title: "How often and how quickly it was correct"
      detail: "Report product denominators: valid listening time and song opportunities, correct first guesses, correct locks, time to first correct guess, time to stable lock, abstention, incorrect-lock dwell, and comparison with external setlist observations where both events and clocks satisfy the frozen policy. Include coverage with precision rather than reporting only correct cases. Keep prediction-blind truth in the primary post-policy metrics and classify outcome-aware reconciliation as diagnostic."
    - title: "The failures the aggregate would hide"
      detail: "Separate recognition misses from capture outages, premusic admission, false switches inside jams, segue ambiguity, unknown or debut material, catalog gaps, controller delays, and publication-path failures. Treat operational invalidity as a product failure to be reported, not automatically as a classifier error."
    - title: "The songs that should have been easy"
      detail: "Return to distinctive openings such as Thatch and Big Modern and ask whether later versions actually recognized them faster. Use selected examples to explain mechanisms only after the complete August-run denominators are visible."
    - title: "What reached the screen and chat"
      detail: "Separate a generated guess, controller lock, UI-observed state, attempted publication, acknowledged delivery, visible post, correction, and duplicate. Use first-person or explicitly qualitative feedback to discuss whether the tool felt helpful; do not infer viewer benefit from telemetry alone."
    - title: "What the tour changed"
      detail: "End with the product verdict supported by the collected record, the changes retained for the next run, and the questions that remain open. A strong, mixed, poor, or operationally compromised result must all be publishable endings."
  evidence:
    - "Frozen SetScope August 13-28 western-run retrospective policy v2 plus its policy v3 addendum, eleven-show manifest, artifact schemas, scoring derivation, scope matrix, and adversarial test vectors, with SHA-256 digests and repository commits preserved before the August 15 show; the invalid v1 freeze draft is recorded separately and the machine-readable run ledger is updated after each show."
