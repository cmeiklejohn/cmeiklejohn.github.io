---
layout: default
---
<article class="page app-detail">

    <img class="app-icon" src="/images/apps/{{ page.app_icon }}.png" width="96" height="96" alt="" />
    <h1 class="post-title">{{ page.title }}</h1>
  </header>
  <div id="post">{{ content }}</div>
</article>
